<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#080811;
    color:#f1f1f1;
    font-family:'Hind Siliguri', 'Poppins', Arial, sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  
  /* ব্যাকগ্রাউন্ড আরজিবি লাইট গ্লো ইফেক্ট */
  .ambient-glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(130px);
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
    animation: floatGlow 10s ease-in-out infinite alternate;
  }

  .glow-1 {
    background: #ff007f;
    top: 5%;
    left: 10%;
  }

  .glow-2 {
    background: #00f2fe;
    top: 30%;
    right: 10%;
    animation-delay: -5s;
  }

  @keyframes floatGlow {
    0% { transform: scale(1) translate(0, 0); }
    50% { transform: scale(1.2) translate(30px, 40px); }
    100% { transform: scale(0.9) translate(-20px, 20px); }
  }

  /* হেডার এরিয়া (আগের আরজিবি স্টাইল) */
  .header{
    padding:35px 15px 15px;
    text-align:center;
    position: relative;
    z-index: 1;
  }
  .header h1{
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ff007f, #00f2fe, #7000ff, #ff007f);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbText 5s linear infinite;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  .header p{
    color: #b0b0cf;
    font-size: 1rem;
    margin-top: 4px;
  }

  @keyframes rgbText {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
  }

  /* ভিডিও সেকশন স্টাইল */
  .video-box-container {
    text-align: center;
    margin: 10px auto 25px auto;
    position: relative;
    z-index: 1;
    padding: 0 15px;
  }

  .video-caption {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 15px;
    padding: 8px 22px;
    background: rgba(255, 0, 127, 0.15);
    border: 1px solid rgba(255, 0, 127, 0.4);
    border-radius: 30px;
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
  }

  .video-caption i {
    color: #00f2fe;
    animation: pulseIcon 1.5s infinite;
  }

  @keyframes pulseIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  /* ভিডিও কার্ড ফ্রেম (RGB বর্ডার) */
  .video-frame-wrapper {
    position: relative;
    padding: 3px;
    background: linear-gradient(135deg, #00f2fe, #ff007f, #7000ff);
    background-size: 300% 300%;
    animation: rgbBorder 6s ease infinite;
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
    display: inline-block;
    max-width: 100%;
  }

  .video-frame-inner {
    background: #0f0f1a;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .video-frame-inner iframe {
    border: none;
    display: block;
    max-width: 100%;
  }

  /* সার্চ বক্স */
  .search-area{
    max-width:650px;
    margin:10px auto 25px auto;
    padding:0 15px;
    position: relative;
    z-index: 1;
  }
  #searchBox{
    width:100%;
    padding:13px 22px;
    border-radius:30px;
    border:1px solid #2a2a35;
    outline:none;
    background:#15151c;
    color:white;
    font-size:15px;
    transition:0.3s;
  }
  #searchBox:focus{
    border-color:#ff0055;
    box-shadow:0 0 12px rgba(255, 0, 85, 0.4);
  }

  /* ভিডিও গ্রিড */
  .video-grid{
    max-width:1400px;
    margin:auto;
    padding:15px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
    gap:22px 18px;
    position: relative;
    z-index: 1;
  }

  /* RGB বর্ডার */
  .video-card{
    position:relative;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    border-radius:16px;
    padding:2px;
    cursor:pointer;
    background:linear-gradient(60deg, #ff0000, #ff7300, #ffee00, #00ff66, #00c3ff, #7a00ff, #ff00aa, #ff0000);
    background-size:400% 400%;
    animation:rgbAnimation 8s ease infinite;
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }

  @keyframes rgbBorder{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  @keyframes rgbAnimation{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .video-card:hover{
    transform:translateY(-5px) scale(1.01);
    box-shadow:0 0 18px rgba(0, 195, 255, 0.4), 0 0 25px rgba(255, 0, 100, 0.3);
  }

  .card-inner{
    background:#131318;
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100%;
    padding:7px;
  }

  /* থাম্বনেইল বক্স */
  .thumb-container{
    width:100%;
    aspect-ratio:16 / 9;
    position:relative;
    border-radius:10px;
    overflow:hidden;
    background:#050508;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .thumb-container img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .play-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:52px;
    height:52px;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(3px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:20px;
    padding-left:4px;
    transition:all 0.25s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.6);
  }
  .video-card:hover .play-btn{
    background:#ff0000;
    transform:translate(-50%, -50%) scale(1.15);
  }

  .card-info{
    padding:12px 6px 6px;
    text-align:center;
  }
  .card-title{
    font-size:16px;
    font-weight:600;
    color:#f1f1f1;
    letter-spacing:0.3px;
  }

  .no-result{text-align:center;color:#888;padding:60px 10px;display:none;position: relative;z-index: 1;}

  @media(max-width:500px){
    .header h1 { font-size: 1.7rem; }
    .video-grid{grid-template-columns:1fr; gap:18px; padding:12px;}
    .play-btn{width:46px; height:46px; font-size:18px;}
    .video-frame-inner iframe {
      width: 100% !important;
      max-width: 320px;
    }
  }

// অটো-লিস্ট পার্সার
const videos = rawVideos.trim().split(/\r?\n/).map(url => url.trim()).filter(Boolean);
const thumbnails = rawThumbnails.trim().split(/\r?\n/).map(url => url.trim()).filter(Boolean);

function getTitle(index){
  return `ভাইরাল ভিডিও - ${index + 1}`;
}

function renderVideos(filteredIndices){
  const grid = document.getElementById("videoGrid");
  const noResult = document.getElementById("noResult");
  grid.innerHTML = "";

  if(!filteredIndices.length){
    noResult.style.display = "block";
    return;
  }
  noResult.style.display = "none";

  filteredIndices.forEach(index => {
    const url = videos[index];
    const thumb = thumbnails[index] || "";
    const title = getTitle(index);

    const card = document.createElement("a");
    card.className = "video-card";
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    card.innerHTML = `
      <div class="card-inner">
        <div class="thumb-container">
          <img src="${thumb}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/640x360?text=No+Image'">
          <div class="play-btn">▶</div>
        </div>
        <div class="card-info">
          <div class="card-title">${title}</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function searchVideos(){
  const keyword = document.getElementById("searchBox").value.toLowerCase().trim();
  const matchedIndices = [];

  videos.forEach((_, index) => {
    const title = getTitle(index).toLowerCase();
    if(title.includes(keyword) || (index + 1).toString().includes(keyword)){
      matchedIndices.push(index);
    }
  });

  renderVideos(matchedIndices);
}

// লোড করার কোড
const initialIndices = videos.map((_, i) => i);
renderVideos(initialIndices);
